name: Publicar StartupDrops

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"  # remonta todo dia às 6h07 de Brasília

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Montar o site
        run: python build.py && python previa.py  # sem domínio próprio: links relativos (depois do domínio, publicar _site)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _previa
      - id: deploy
        uses: actions/deploy-pages@v4
