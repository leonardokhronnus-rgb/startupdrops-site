<article class="news-card">
  <a href="{{ d.href }}" aria-hidden="true" tabindex="-1">{% include "_visual.html" %}</a>
  <div class="card-inner">
    <span class="card-category">{{ d.kicker }}{% if d.setor %} <span class="card-tag">{{ d.setor }}</span>{% endif %}</span>
    <h3><a href="{{ d.href }}">{{ d.titulo }}</a></h3>
    <div class="card-bottom"><span>{{ d.data_curta | upper }}</span><a href="{{ d.href }}">LER</a></div>
  </div>
</article>
