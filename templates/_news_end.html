{% if site.newsletter_action %}
<section class="news-end">
  <div class="news-end-card">
    <div class="news-end-head"><img src="/static/img/logo.png" alt="StartupDrops"><span>Newsletter</span></div>
    <h3>O que um fundador precisa ler, <em>todo dia no seu e-mail.</em> Vai ficar de fora?</h3>
    <form action="{{ site.newsletter_action }}" method="post" target="_blank" data-umami-event="newsletter-materia">
      <div class="news-end-fields"><input type="text" name="metadata__nome" placeholder="Nome completo" aria-label="Nome completo"><input type="email" name="email" required placeholder="O seu melhor e-mail" aria-label="E-mail"></div>
      <div class="news-end-foot"><label><input type="checkbox" required> Li e concordo com a <a href="/privacidade/">política de privacidade</a>.</label><button type="submit">CADASTRAR</button></div>
    </form>
  </div>
</section>
{% endif %}
