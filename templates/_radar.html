<a class="radar-entry" href="{{ d.href }}">{% if d.imagem %}<img class="radar-thumb" src="{{ d.thumb }}" alt="" loading="lazy" decoding="async">{% else %}<span class="radar-num">{{ '%02d' % n }}</span>{% endif %}<div><span class="type">{{ d.setor or d.kicker }}{% if d.valor %} · {{ d.valor }}{% endif %}</span><h3>{{ d.titulo }}</h3><small>{{ d.autor | upper }} · {{ d.data_curta | upper }}</small></div></a>
